<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MindPulseAI</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="container">

  <header>
    <div class="logo">MindPulseAI</div>
    <p>Intelligent real-time conversational agent</p>
  </header>

  <main>

    <form method="POST" action="/chatbot">
      <div class="input-area">
        <input
                type="text"
                name="message"
                placeholder="Send a prompt or query..."
                autocomplete="off"
                required
        >
        <button type="submit" aria-label="Submit query">→</button>
      </div>
    </form>

    <section class="answer-section">
      <h2>Response</h2>
      <div class="answer-box">
        <p>{{ANSWER}}</p>
      </div>
    </section>

  </main>

  <footer>
    <p>MindPulseAI · Powered by Gemini API</p>
  </footer>

</div>

</body>
</html>
